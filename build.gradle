plugins {
    id 'java'
    id 'application'
}

group = 'com.cyclops'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.cyclops.Main'
}

dependencies {
    // Look and Feel UI & Code Editor
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-extras:3.5.4'
    implementation 'com.fifesoft:rsyntaxtextarea:3.4.0'

    // XML Engine (Saxon-HE for XPath 3.1 & XQuery 3.1)
    implementation 'net.sf.saxon:Saxon-HE:12.5'

    // JSON Engine (Jackson & Jayway JsonPath)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'

    // CSV & Delimited Engine
    implementation 'org.apache.commons:commons-csv:1.12.0'

    // Embedded SQL Engine (DuckDB JDBC for SQL queries over CSV, Parquet, Avro, ORC)
    implementation 'org.duckdb:duckdb_jdbc:1.1.3'

    // Avro & ORC Data Formats
    implementation 'org.apache.avro:avro:1.12.0'
    implementation 'org.apache.orc:orc-core:2.0.0'

    // Logging (NOP implementation to avoid cluttering stderr)
    implementation 'org.slf4j:slf4j-nop:2.0.16'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.cyclops.Main'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
